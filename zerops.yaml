zerops:
  - setup: api
    build:
      base: nodejs@20
      buildCommands:
        - npm install
      deployFiles:
        - server.js
        - package.json
        - package-lock.json
        - public
        - node_modules
      cache:
        - node_modules
    run:
      base: nodejs@20
      ports:
        - port: 5000
          httpSupport: true
      start: node server.js